databases:
  - name: kestrel-db
    plan: free
    databaseName: kestrel
    user: kestrel

services:
  - type: web
    name: kestrel-watch-co
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kestrel-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Deliberately no NODE_ENV var here — Next.js already runs in
      # production mode via `next start`, and setting NODE_ENV=production
      # as an env var makes `npm install` skip devDependencies during the
      # BUILD too (tailwindcss, @tailwindcss/postcss, typescript), which
      # breaks `next build`.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
